<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="whats-next: find the next ready ticket">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <g opacity="0.45">
      <rect x="760" y="56" width="370" height="52" rx="10" fill="#1f2937" stroke="#374151"/>
      <circle cx="786" cy="82" r="7" fill="#ef4444"/>
      <text x="804" y="87" fill="#9ca3af">#42  blocked by #38</text>
    </g>
    <g opacity="0.6">
      <rect x="760" y="124" width="370" height="52" rx="10" fill="#1f2937" stroke="#374151"/>
      <circle cx="786" cy="150" r="7" fill="#f59e0b"/>
      <text x="804" y="155" fill="#d1d5db">#51  already assigned</text>
    </g>
    <g>
      <rect x="760" y="192" width="370" height="52" rx="10" fill="#0f2a2e" stroke="url(#accent)" stroke-width="2.5"/>
      <circle cx="786" cy="218" r="7" fill="#22c55e"/>
      <text x="804" y="223" fill="#ecfeff" font-weight="700">#47  ready now  &#8592; start here</text>
    </g>
    <g opacity="0.45">
      <rect x="760" y="260" width="370" height="52" rx="10" fill="#1f2937" stroke="#374151"/>
      <circle cx="786" cy="286" r="7" fill="#ef4444"/>
      <text x="804" y="291" fill="#9ca3af">#53  blocked by #47</text>
    </g>
  </g>

  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="72" y="150" font-size="76" font-weight="800" fill="#ffffff">whats<tspan fill="url(#accent)">-next</tspan></text>
    <rect x="76" y="176" width="140" height="6" rx="3" fill="url(#accent)"/>
    <text x="74" y="232" font-size="26" fill="#c9d1d9">Which ticket should I pick up right now?</text>
    <text x="74" y="272" font-size="19" fill="#8b949e">An agent skill that finds the ready-now frontier of your GitHub backlog.</text>
  </g>
</svg>
